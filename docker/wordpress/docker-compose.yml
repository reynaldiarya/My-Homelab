services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-mariadb}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-root}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-your_secure_password}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      # Configure WordPress for HTTPS behind Traefik reverse proxy
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`wordpress.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.routers.wordpress.middlewares=secure-headers@docker"
      - "traefik.http.routers.wordpress.service=wordpress-svc"
      - "traefik.http.routers.wordpress-local.rule=Host(`wordpress.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.wordpress-local.entrypoints=websecure"
      - "traefik.http.routers.wordpress-local.tls=true"
      - "traefik.http.routers.wordpress-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.wordpress-local.service=wordpress-svc"
      - "traefik.http.services.wordpress-svc.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_CPU_LIMIT:-1}"
          memory: ${WORDPRESS_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  wordpress_data: