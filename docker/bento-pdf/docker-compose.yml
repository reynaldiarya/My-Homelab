services:
  bento-pdf:
    image: bentopdf/bentopdf:latest
    container_name: bento-pdf
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bento-pdf.rule=Host(`bento-pdf.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.bento-pdf.entrypoints=websecure"
      - "traefik.http.routers.bento-pdf.tls=true"
      - "traefik.http.routers.bento-pdf.tls.certresolver=cloudflare"
      - "traefik.http.routers.bento-pdf.middlewares=secure-headers@docker"
      - "traefik.http.services.bento-pdf.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${BENTO_PDF_CPU_LIMIT:-0.5}"
          memory: ${BENTO_PDF_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true
