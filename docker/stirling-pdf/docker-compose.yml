services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - SECURITY_ENABLELOGIN=${STIRLING_PDF_SECURITY_ENABLELOGIN:-true}
      - LANGS=${STIRLING_PDF_LANGS:-en_US}
    volumes:
      - stirling_pdf_tessdata:/usr/share/tessdata
      - stirling_pdf_configs:/configs
      - stirling_pdf_logs:/logs
      - stirling_pdf_pipeline:/pipeline
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling-pdf.rule=Host(`pdf.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.stirling-pdf.entrypoints=websecure"
      - "traefik.http.routers.stirling-pdf.tls=true"
      - "traefik.http.routers.stirling-pdf.middlewares=secure-headers@docker"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${STIRLING_PDF_CPU_LIMIT:-1}"
          memory: ${STIRLING_PDF_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  stirling_pdf_tessdata:
  stirling_pdf_configs:
  stirling_pdf_logs:
  stirling_pdf_pipeline:
