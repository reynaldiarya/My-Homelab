services:
  blesta:
    image: ppmathis/blesta:latest
    container_name: blesta
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BLESTA_ADDRESS: 0.0.0.0
      BLESTA_HOST: blesta.${TRAEFIK_DOMAIN:-yourdomain.com}
    volumes:
      - blesta_data:/opt/blesta/data
    tmpfs:
      - /run:uid=65532,gid=65532,mode=0755,exec,nodev,nosuid
      - /tmp:uid=65532,gid=65532,mode=2777,noexec,nodev,nosuid
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blesta.rule=Host(`blesta.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.blesta.entrypoints=websecure"
      - "traefik.http.routers.blesta.tls=true"
      - "traefik.http.routers.blesta.middlewares=secure-headers@docker"
      - "traefik.http.routers.blesta.service=blesta-svc"
      - "traefik.http.routers.blesta-local.rule=Host(`blesta.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.blesta-local.entrypoints=websecure"
      - "traefik.http.routers.blesta-local.tls=true"
      - "traefik.http.routers.blesta-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.blesta-local.service=blesta-svc"
      - "traefik.http.services.blesta-svc.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${BLESTA_CPU_LIMIT:-1}"
          memory: ${BLESTA_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  blesta_data: