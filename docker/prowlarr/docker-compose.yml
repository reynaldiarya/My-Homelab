services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PUID: ${PROWLARR_PUID:-1000}
      PGID: ${PROWLARR_PGID:-1000}
    volumes:
      - prowlarr_config:/config
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.middlewares=secure-headers@docker"
      - "traefik.http.routers.prowlarr.service=prowlarr-svc"
      - "traefik.http.routers.prowlarr-local.rule=Host(`prowlarr.${LOCAL_DOMAIN:-home.arpa}`)"
      - "traefik.http.routers.prowlarr-local.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-local.tls=true"
      - "traefik.http.routers.prowlarr-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.prowlarr-local.service=prowlarr-svc"
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"
    deploy:
      resources:
        limits:
          cpus: "${PROWLARR_CPU_LIMIT:-0.5}"
          memory: ${PROWLARR_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  prowlarr_config:
