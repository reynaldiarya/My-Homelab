services:
  wealthfolio:
    image: afadil/wealthfolio:latest
    container_name: wealthfolio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DB_PATH: ./db/app.db
      WF_SECRET_KEY: ${WEALTHFOLIO_SECRET_KEY}
      WF_CORS_ALLOW_ORIGINS: https://wealthfolio.${TRAEFIK_DOMAIN:-yourdomain.com}
      WF_REQUEST_TIMEOUT_MS: ${WEALTHFOLIO_REQUEST_TIMEOUT_MS:-30000}
      WF_STATIC_DIR: dist
      WF_AUTH_PASSWORD_HASH: ${WEALTHFOLIO_AUTH_PASSWORD_HASH}
      WF_AUTH_TOKEN_TTL_MINUTES: ${WEALTHFOLIO_AUTH_TOKEN_TTL_MINUTES:-60}
      WF_AUTH_REQUIRED: ${WEALTHFOLIO_AUTH_REQUIRED:-false}
    volumes:
      - wealthfolio_data:/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wealthfolio.rule=Host(`wealthfolio.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.wealthfolio.entrypoints=websecure"
      - "traefik.http.routers.wealthfolio.tls=true"
      - "traefik.http.routers.wealthfolio.middlewares=secure-headers@docker"
      - "traefik.http.services.wealthfolio.loadbalancer.server.port=8088"
    deploy:
      resources:
        limits:
          cpus: "${WEALTHFOLIO_CPU_LIMIT:-0.5}"
          memory: ${WEALTHFOLIO_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  wealthfolio_data:
