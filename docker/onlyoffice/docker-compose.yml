services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-true}
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-your_secure_jwt_secret}
      - JWT_HEADER=${ONLYOFFICE_JWT_HEADER:-Authorization}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice.tls=true"
      - "traefik.http.routers.onlyoffice.middlewares=secure-headers@docker"
      - "traefik.http.routers.onlyoffice.service=onlyoffice-svc"
      - "traefik.http.routers.onlyoffice-local.rule=Host(`onlyoffice.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.onlyoffice-local.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice-local.tls=true"
      - "traefik.http.routers.onlyoffice-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.onlyoffice-local.service=onlyoffice-svc"
      - "traefik.http.services.onlyoffice-svc.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${ONLYOFFICE_CPU_LIMIT:-1}"
          memory: ${ONLYOFFICE_MEMORY_LIMIT:-2G}

networks:
  homelab:
    external: true

volumes:
  onlyoffice_data:
  onlyoffice_logs: