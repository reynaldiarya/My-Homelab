services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PUID: ${RADARR_PUID:-1000}
      PGID: ${RADARR_PGID:-1000}
    volumes:
      - radarr_config:/config
      - ${MEDIA_DIR:-/media}:/media
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.middlewares=secure-headers@docker"
      - "traefik.http.routers.radarr.service=radarr-svc"
      - "traefik.http.routers.radarr-local.rule=Host(`radarr.${LOCAL_DOMAIN:-home.arpa}`)"
      - "traefik.http.routers.radarr-local.entrypoints=websecure"
      - "traefik.http.routers.radarr-local.tls=true"
      - "traefik.http.routers.radarr-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.radarr-local.service=radarr-svc"
      - "traefik.http.services.radarr-svc.loadbalancer.server.port=7878"
    deploy:
      resources:
        limits:
          cpus: "${RADARR_CPU_LIMIT:-0.5}"
          memory: ${RADARR_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  radarr_config:
