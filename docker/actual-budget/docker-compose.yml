services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=${ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB:-20}
      - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=${ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB:-50}
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=${ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB:-20}
    volumes:
      - actual_budget_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actual-budget.rule=Host(`budget.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.actual-budget.entrypoints=websecure"
      - "traefik.http.routers.actual-budget.tls=true"
      - "traefik.http.routers.actual-budget.middlewares=secure-headers@docker"
      - "traefik.http.routers.actual-budget.service=actual-budget-svc"
      - "traefik.http.routers.actual-budget-local.rule=Host(`budget.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.actual-budget-local.entrypoints=websecure"
      - "traefik.http.routers.actual-budget-local.tls=true"
      - "traefik.http.routers.actual-budget-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.actual-budget-local.service=actual-budget-svc"
      - "traefik.http.services.actual-budget-svc.loadbalancer.server.port=5006"
    deploy:
      resources:
        limits:
          cpus: "${ACTUAL_BUDGET_CPU_LIMIT:-0.5}"
          memory: ${ACTUAL_BUDGET_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true

volumes:
  actual_budget_data: