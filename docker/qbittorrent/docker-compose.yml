services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PUID: ${QBITTORRENT_PUID:-1000}
      PGID: ${QBITTORRENT_PGID:-1000}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
      TORRENTING_PORT: ${QBITTORRENT_PORT:-6881}
    volumes:
      - qbittorrent_config:/config
      - ${MEDIA_DIR:-/media}:/data
    networks:
      - homelab
    ports:
      - "${QBITTORRENT_PORT:-6881}:6881"
      - "${QBITTORRENT_PORT:-6881}:6881/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`torrent.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.middlewares=secure-headers@docker"
      - "traefik.http.routers.qbittorrent.service=qbittorrent-svc"
      - "traefik.http.routers.qbittorrent-local.rule=Host(`torrent.${LOCAL_DOMAIN:-home.arpa}`)"
      - "traefik.http.routers.qbittorrent-local.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent-local.tls=true"
      - "traefik.http.routers.qbittorrent-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.qbittorrent-local.service=qbittorrent-svc"
      - "traefik.http.services.qbittorrent-svc.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${QBITTORRENT_CPU_LIMIT:-1}"
          memory: ${QBITTORRENT_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  qbittorrent_config:
