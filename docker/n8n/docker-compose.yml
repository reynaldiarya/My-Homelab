services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      GENERIC_TIMEZONE: ${TZ:-Asia/Jakarta}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_HOST: ${N8N_DB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${N8N_DB_PORT:-5432}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-root}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-password}
      N8N_PROTOCOL: https
      N8N_HOST: n8n.${TRAEFIK_DOMAIN:-yourdomain.com}
      WEBHOOK_URL: https://n8n.${TRAEFIK_DOMAIN:-yourdomain.com}
      N8N_EDITOR_BASE_URL: https://n8n.${TRAEFIK_DOMAIN:-yourdomain.com}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
      - "traefik.http.routers.n8n.middlewares=secure-headers@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          cpus: "${N8N_CPU_LIMIT:-1}"
          memory: ${N8N_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  n8n_data:
