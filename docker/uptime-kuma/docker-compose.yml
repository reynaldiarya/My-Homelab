services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`status.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.routers.uptime-kuma.middlewares=secure-headers@docker"
      - "traefik.http.routers.uptime-kuma.service=uptime-kuma-svc"
      - "traefik.http.routers.uptime-kuma-local.rule=Host(`status.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.uptime-kuma-local.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma-local.tls=true"
      - "traefik.http.routers.uptime-kuma-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.uptime-kuma-local.service=uptime-kuma-svc"
      - "traefik.http.services.uptime-kuma-svc.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: "${UPTIME_KUMA_CPU_LIMIT:-0.5}"
          memory: ${UPTIME_KUMA_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true

volumes:
  uptime_kuma_data: