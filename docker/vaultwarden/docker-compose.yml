services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      DOMAIN: https://vaultwarden.${TRAEFIK_DOMAIN:-yourdomain.com}
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      INVITATIONS_ALLOWED: "${VAULTWARDEN_INVITATIONS_ALLOWED:-true}"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-change_me_to_a_long_random_token}
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.middlewares=secure-headers@docker"
      - "traefik.http.routers.vaultwarden.service=vaultwarden-svc"
      - "traefik.http.routers.vaultwarden-local.rule=Host(`vaultwarden.${LOCAL_DOMAIN:-home.arpa}`)"
      - "traefik.http.routers.vaultwarden-local.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-local.tls=true"
      - "traefik.http.routers.vaultwarden-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.vaultwarden-local.service=vaultwarden-svc"
      - "traefik.http.services.vaultwarden-svc.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${VAULTWARDEN_CPU_LIMIT:-0.5}"
          memory: ${VAULTWARDEN_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  vaultwarden_data:
