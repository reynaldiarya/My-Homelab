services:
  ryot:
    image: ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - DATABASE_URL=${RYOT_DATABASE_URL}
      - SERVER_ADMIN_ACCESS_TOKEN=${RYOT_SERVER_ADMIN_ACCESS_TOKEN}
      - FRONTEND_URL=https://ryot.${TRAEFIK_DOMAIN:-yourdomain.com}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${RYOT_SERVER_IMPORTER_TRAKT_CLIENT_ID}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${RYOT_MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - ANIME_AND_MANGA_MAL_CLIENT_ID=${RYOT_ANIME_AND_MANGA_MAL_CLIENT_ID}
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ryot.rule=Host(`ryot.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.ryot.entrypoints=websecure"
      - "traefik.http.routers.ryot.tls=true"
      - "traefik.http.routers.ryot.middlewares=secure-headers@docker"
      - "traefik.http.services.ryot.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: "${RYOT_CPU_LIMIT:-0.5}"
          memory: ${RYOT_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true
