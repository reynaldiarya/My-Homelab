services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`excalidraw.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.excalidraw.entrypoints=websecure"
      - "traefik.http.routers.excalidraw.tls=true"
      - "traefik.http.routers.excalidraw.tls.certresolver=cloudflare"
      - "traefik.http.routers.excalidraw.middlewares=secure-headers@docker"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${EXCALIDRAW_CPU_LIMIT:-0.5}"
          memory: ${EXCALIDRAW_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true
