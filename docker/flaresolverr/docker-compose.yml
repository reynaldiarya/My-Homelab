services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_FILE=${FLARESOLVERR_LOG_FILE:-none}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:-false}
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
    volumes:
      - flaresolverr_data:/config
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.flaresolverr.entrypoints=websecure"
      - "traefik.http.routers.flaresolverr.tls=true"
      - "traefik.http.routers.flaresolverr.middlewares=secure-headers@docker,internal-only@file"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
    deploy:
      resources:
        limits:
          cpus: "${FLARESOLVERR_CPU_LIMIT:-1}"
          memory: ${FLARESOLVERR_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  flaresolverr_data:
