services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-home.${TRAEFIK_DOMAIN:-yourdomain.com},home.${LOCAL_DOMAIN:-local}}
      PUID: ${HOMEPAGE_PUID:-1000}
      PGID: ${HOMEPAGE_PGID:-1000}
      HOMEPAGE_VAR_LOGO_ICON: ${HOMEPAGE_VAR_LOGO_ICON}
      HOMEPAGE_VAR_BACKGROUND_IMAGE: ${HOMEPAGE_VAR_BACKGROUND_IMAGE}
      # Service URLs (via Traefik - default to HOMEPAGE_SERVICE_DOMAIN or LOCAL_DOMAIN)
      HOMEPAGE_VAR_ACTUAL_BUDGET_URL: ${HOMEPAGE_VAR_ACTUAL_BUDGET_URL:-https://budget.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_ADGUARD_HOME_URL: ${HOMEPAGE_VAR_ADGUARD_HOME_URL:-https://adguard.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_BENTO_PDF_URL: ${HOMEPAGE_VAR_BENTO_PDF_URL:-https://bento-pdf.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_BESZEL_URL: ${HOMEPAGE_VAR_BESZEL_URL:-https://beszel.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_BLESTA_URL: ${HOMEPAGE_VAR_BLESTA_URL:-https://blesta.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_BUGSINK_URL: ${HOMEPAGE_VAR_BUGSINK_URL:-https://bugsink.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_CHANGEDETECTION_URL: ${HOMEPAGE_VAR_CHANGEDETECTION_URL:-https://changedetection.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_EXCALIDRAW_URL: ${HOMEPAGE_VAR_EXCALIDRAW_URL:-https://excalidraw.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_FLARESOLVERR_URL: ${HOMEPAGE_VAR_FLARESOLVERR_URL:-https://flaresolverr.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_GRAFANA_URL: ${HOMEPAGE_VAR_GRAFANA_URL:-https://grafana.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_INFLUXDB_URL: ${HOMEPAGE_VAR_INFLUXDB_URL:-https://influxdb.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_IT_TOOLS_URL: ${HOMEPAGE_VAR_IT_TOOLS_URL:-https://it-tools.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_LISTMONK_URL: ${HOMEPAGE_VAR_LISTMONK_URL:-https://listmonk.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_N8N_URL: ${HOMEPAGE_VAR_N8N_URL:-https://n8n.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_NETDATA_URL: ${HOMEPAGE_VAR_NETDATA_URL:-https://netdata.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_NEXTCLOUD_URL: ${HOMEPAGE_VAR_NEXTCLOUD_URL:-https://nextcloud.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_OLLAMA_URL: ${HOMEPAGE_VAR_OLLAMA_URL:-https://ollama.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_ONLYOFFICE_URL: ${HOMEPAGE_VAR_ONLYOFFICE_URL:-https://onlyoffice.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_OPEN_WEBUI_URL: ${HOMEPAGE_VAR_OPEN_WEBUI_URL:-https://openwebui.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_OPENSPEEDTEST_URL: ${HOMEPAGE_VAR_OPENSPEEDTEST_URL:-https://speedtest.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_PORTAINER_URL: ${HOMEPAGE_VAR_PORTAINER_URL:-https://portainer.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_RYOT_URL: ${HOMEPAGE_VAR_RYOT_URL:-https://ryot.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_SERPBEAR_URL: ${HOMEPAGE_VAR_SERPBEAR_URL:-https://serpbear.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_SMOKEPING_URL: ${HOMEPAGE_VAR_SMOKEPING_URL:-https://smokeping.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_STIRLING_PDF_URL: ${HOMEPAGE_VAR_STIRLING_PDF_URL:-https://pdf.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_UPTIME_KUMA_URL: ${HOMEPAGE_VAR_UPTIME_KUMA_URL:-https://status.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_WALLOS_URL: ${HOMEPAGE_VAR_WALLOS_URL:-https://wallos.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_WEALTHFOLIO_URL: ${HOMEPAGE_VAR_WEALTHFOLIO_URL:-https://wealthfolio.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_WORDPRESS_URL: ${HOMEPAGE_VAR_WORDPRESS_URL:-https://wordpress.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
      HOMEPAGE_VAR_TRAEFIK_URL: ${HOMEPAGE_VAR_TRAEFIK_URL:-https://traefik.${HOMEPAGE_SERVICE_DOMAIN:-${LOCAL_DOMAIN:-local}}}
    volumes:
      - homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.middlewares=secure-headers@docker"
      - "traefik.http.routers.homepage.service=homepage-svc"
      - "traefik.http.routers.homepage-local.rule=Host(`home.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.homepage-local.entrypoints=websecure"
      - "traefik.http.routers.homepage-local.tls=true"
      - "traefik.http.routers.homepage-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.homepage-local.service=homepage-svc"
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "${HOMEPAGE_CPU_LIMIT:-0.5}"
          memory: ${HOMEPAGE_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true

volumes:
  homepage: