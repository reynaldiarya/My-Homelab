services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-password}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-homelab}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-bucket}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influxdb.rule=Host(`influxdb.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.influxdb.entrypoints=websecure"
      - "traefik.http.routers.influxdb.tls=true"
      - "traefik.http.routers.influxdb.middlewares=secure-headers@docker,internal-only@file"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
    deploy:
      resources:
        limits:
          cpus: "${INFLUXDB_CPU_LIMIT:-1}"
          memory: ${INFLUXDB_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  influxdb_data:
  influxdb_config:
