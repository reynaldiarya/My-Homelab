services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      OLLAMA_BASE_URL: ${OPEN_WEBUI_OLLAMA_BASE_URL:-http://ollama:11434}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-your_secure_secret_key}
      WEBUI_URL: "https://openwebui.${TRAEFIK_DOMAIN:-yourdomain.com}"
      WEBUI_AUTH: "true"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`openwebui.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=cloudflare"
      - "traefik.http.routers.open-webui.middlewares=secure-headers@docker"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${OPEN_WEBUI_CPU_LIMIT:-1}"
          memory: ${OPEN_WEBUI_MEMORY_LIMIT:-2G}

networks:
  homelab:
    external: true

volumes:
  open_webui_data:
