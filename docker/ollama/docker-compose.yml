services:
  ollama:
    image: ollama/ollama:latest #If you have a amd gpu use ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homelab
    ## AMD GPU Support (ROCm) ##
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    # environment:
    #   - HSA_OVERRIDE_GFX_VERSION=${OLLAMA_HSA_OVERRIDE_GFX_VERSION:-10.3.0}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.middlewares=secure-headers@docker,internal-only@file"
      - "traefik.http.routers.ollama.service=ollama-svc"
      - "traefik.http.routers.ollama-local.rule=Host(`ollama.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.ollama-local.entrypoints=websecure"
      - "traefik.http.routers.ollama-local.tls=true"
      - "traefik.http.routers.ollama-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.ollama-local.service=ollama-svc"
      - "traefik.http.services.ollama-svc.loadbalancer.server.port=11434"
    deploy:
      resources:
        ## NVIDIA GPU Support ##
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-4}"
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}

networks:
  homelab:
    external: true

volumes:
  ollama_data: