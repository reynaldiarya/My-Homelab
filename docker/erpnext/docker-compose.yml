services:
  backend:
    image: frappe/erpnext:latest
    container_name: erpnext-backend
    restart: unless-stopped
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_CPU_LIMIT:-1}"
          memory: ${ERPNEXT_MEMORY_LIMIT:-1G}
      restart_policy:
        condition: on-failure
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: ${ERPNEXT_DB_HOST:-mariadb}
      DB_PORT: "${MARIADB_PORT:-3306}"
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:latest
    container_name: erpnext-configurator
    networks:
      - homelab
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${ERPNEXT_DB_HOST:-mariadb}
      DB_PORT: "${MARIADB_PORT:-3306}"
      REDIS_CACHE: ${ERPNEXT_REDIS_CACHE:-:${REDIS_PASSWORD:-password}@redis:6379/0}
      REDIS_QUEUE: ${ERPNEXT_REDIS_QUEUE:-:${REDIS_PASSWORD:-password}@redis:6379/1}
      SOCKETIO_PORT: "${ERPNEXT_SOCKETIO_PORT:-9000}"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:latest
    container_name: erpnext-create-site
    networks:
      - homelab
    deploy:
      restart_policy:
        condition: none
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    environment:
      DB_NAME: ${ERPNEXT_DB_NAME:-}
      DB_USER: ${ERPNEXT_DB_USER:-}
      DB_PASSWORD: ${ERPNEXT_DB_PASSWORD:-}
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 ${ERPNEXT_DB_HOST:-mariadb}:${MARIADB_PORT:-3306};
        wait-for-it -t 120 ${ERPNEXT_REDIS_HOST:-redis}:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/${ERPNEXT_SITE_NAME:-frontend}" ]; then
          echo "Site ${ERPNEXT_SITE_NAME:-frontend} already exists, skipping creation";
        else
          EXTRA_ARGS="";
          if [ -n "$$DB_NAME" ]; then EXTRA_ARGS="$$EXTRA_ARGS --db-name $$DB_NAME"; fi;
          if [ -n "$$DB_USER" ]; then EXTRA_ARGS="$$EXTRA_ARGS --db-user $$DB_USER"; fi;
          if [ -n "$$DB_PASSWORD" ]; then EXTRA_ARGS="$$EXTRA_ARGS --db-password $$DB_PASSWORD"; fi;
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=${ERPNEXT_ADMIN_PASSWORD:-admin} --db-root-username=root --db-root-password=${MARIADB_ROOT_PASSWORD:-password} $$EXTRA_ARGS --install-app erpnext --set-default ${ERPNEXT_SITE_NAME:-frontend};
        fi;

  frontend:
    image: frappe/erpnext:latest
    container_name: erpnext-frontend
    restart: unless-stopped
    networks:
      - homelab
    depends_on:
      - websocket
      - backend
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_CPU_LIMIT:-1}"
          memory: ${ERPNEXT_MEMORY_LIMIT:-1G}
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-frontend}
      SOCKETIO: websocket:${ERPNEXT_SOCKETIO_PORT:-9000}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: ${ERPNEXT_PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${ERPNEXT_CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erpnext.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls=true"
      - "traefik.http.routers.erpnext.middlewares=secure-headers@docker"
      - "traefik.http.routers.erpnext.service=erpnext-svc"
      - "traefik.http.routers.erpnext-local.rule=Host(`erpnext.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.erpnext-local.entrypoints=websecure"
      - "traefik.http.routers.erpnext-local.tls=true"
      - "traefik.http.routers.erpnext-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.erpnext-local.service=erpnext-svc"
      - "traefik.http.services.erpnext-svc.loadbalancer.server.port=8080"

  queue-long:
    image: frappe/erpnext:latest
    container_name: erpnext-queue-long
    restart: unless-stopped
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_WORKER_CPU_LIMIT:-0.5}"
          memory: ${ERPNEXT_WORKER_MEMORY_LIMIT:-512M}
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://${ERPNEXT_REDIS_CACHE:-:${REDIS_PASSWORD:-password}@redis:6379/0}
      FRAPPE_REDIS_QUEUE: redis://${ERPNEXT_REDIS_QUEUE:-:${REDIS_PASSWORD:-password}@redis:6379/1}
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:latest
    container_name: erpnext-queue-short
    restart: unless-stopped
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_WORKER_CPU_LIMIT:-0.5}"
          memory: ${ERPNEXT_WORKER_MEMORY_LIMIT:-512M}
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://${ERPNEXT_REDIS_CACHE:-:${REDIS_PASSWORD:-password}@redis:6379/0}
      FRAPPE_REDIS_QUEUE: redis://${ERPNEXT_REDIS_QUEUE:-:${REDIS_PASSWORD:-password}@redis:6379/1}
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: frappe/erpnext:latest
    container_name: erpnext-scheduler
    restart: unless-stopped
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_WORKER_CPU_LIMIT:-0.5}"
          memory: ${ERPNEXT_WORKER_MEMORY_LIMIT:-512M}
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:latest
    container_name: erpnext-websocket
    restart: unless-stopped
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${ERPNEXT_WORKER_CPU_LIMIT:-0.5}"
          memory: ${ERPNEXT_WORKER_MEMORY_LIMIT:-512M}
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://${ERPNEXT_REDIS_CACHE:-:${REDIS_PASSWORD:-password}@redis:6379/0}
      FRAPPE_REDIS_QUEUE: redis://${ERPNEXT_REDIS_QUEUE:-:${REDIS_PASSWORD:-password}@redis:6379/1}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  erpnext_sites:
  erpnext_logs:

networks:
  homelab:
    external: true