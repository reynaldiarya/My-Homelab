services:
  serpbear:
    image: towfiqi/serpbear:latest
    container_name: serpbear
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - USER=${SERPBEAR_USER:-admin}
      - PASSWORD=${SERPBEAR_PASSWORD:-password}
      - SECRET=${SERPBEAR_SECRET:-secret}
      - APIKEY=${SERPBEAR_APIKEY:-apikey}
      - NEXT_PUBLIC_APP_URL=https://serpbear.${TRAEFIK_DOMAIN:-yourdomain.com}
    volumes:
      - serpbear_data:/app/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.serpbear.rule=Host(`serpbear.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.serpbear.entrypoints=websecure"
      - "traefik.http.routers.serpbear.tls=true"
      - "traefik.http.routers.serpbear.tls.certresolver=cloudflare"
      - "traefik.http.routers.serpbear.middlewares=secure-headers@docker"
      - "traefik.http.services.serpbear.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "${SERPBEAR_CPU_LIMIT:-0.5}"
          memory: ${SERPBEAR_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  serpbear_data:
