services:
  mikrotik:
    image: mikrotik/chr:latest
    container_name: mikrotik
    restart: unless-stopped
    privileged: true
    hostname: chr
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${MIKROTIK_WINBOX_PORT:-8291}:8291"
      - "${MIKROTIK_WEBFIG_PORT:-8080}:80"
      - "${MIKROTIK_SSH_PORT:-2222}:22"
    volumes:
      - mikrotik_data:/rw
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${MIKROTIK_CPU_LIMIT:-1}"
          memory: ${MIKROTIK_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true

volumes:
  mikrotik_data:
