services:
  mikrotik:
    image: mikrotik/chr:latest
    container_name: mikrotik
    restart: unless-stopped
    privileged: true
    hostname: chr
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - mikrotik_data:/rw
    networks:
      - mikrotik_net
    deploy:
      resources:
        limits:
          cpus: "${MIKROTIK_CPU_LIMIT:-1}"
          memory: ${MIKROTIK_MEMORY_LIMIT:-512M}

networks:
  mikrotik_net:
    driver: macvlan
    driver_opts:
      parent: ${MIKROTIK_INTERFACE:-eth0}

volumes:
  mikrotik_data:
