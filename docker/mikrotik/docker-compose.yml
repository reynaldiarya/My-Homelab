services:
  mikrotik:
    image: mikrotik/chr:latest
    container_name: mikrotik
    restart: unless-stopped
    privileged: true
    hostname: chr
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - mikrotik_data:/rw
    networks:
      mikrotik_net:
        ipv4_address: ${MIKROTIK_IP:-192.168.1.250}
    deploy:
      resources:
        limits:
          cpus: "${MIKROTIK_CPU_LIMIT:-1}"
          memory: ${MIKROTIK_MEMORY_LIMIT:-512M}

networks:
  homelab:
    external: true
  mikrotik_net:
    driver: macvlan
    driver_opts:
      parent: ${MIKROTIK_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: ${MIKROTIK_SUBNET:-192.168.1.0/24}
          gateway: ${MIKROTIK_GATEWAY:-192.168.1.1}

volumes:
  mikrotik_data:
