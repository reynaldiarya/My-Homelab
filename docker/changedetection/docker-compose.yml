services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PLAYWRIGHT_DRIVER_URL: ${CHANGEDETECTION_PLAYWRIGHT_URL:-ws://browser-sockpuppet-chrome:3000}
      BASE_URL: "https://changedetection.${TRAEFIK_DOMAIN:-yourdomain.com}"
      FETCH_WORKERS: ${CHANGEDETECTION_FETCH_WORKERS:-10}
    volumes:
      - changedetection_data:/datastore
    networks:
      - homelab
    depends_on:
      - browser-sockpuppet-chrome
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.changedetection.rule=Host(`changedetection.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.routers.changedetection.tls.certresolver=cloudflare"
      - "traefik.http.routers.changedetection.middlewares=secure-headers@docker"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"
    deploy:
      resources:
        limits:
          cpus: "${CHANGEDETECTION_CPU_LIMIT:-0.5}"
          memory: ${CHANGEDETECTION_MEMORY_LIMIT:-512M}

  browser-sockpuppet-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: browser-sockpuppet-chrome
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      SCREEN_WIDTH: ${SOCKPUPPET_SCREEN_WIDTH:-1920}
      SCREEN_HEIGHT: ${SOCKPUPPET_SCREEN_HEIGHT:-1024}
      SCREEN_DEPTH: ${SOCKPUPPET_SCREEN_DEPTH:-16}
      MAX_CONCURRENT_CHROME_PROCESSES: ${SOCKPUPPET_MAX_CONCURRENT_CHROME_PROCESSES:-10}
    networks:
      - homelab
    deploy:
      resources:
        limits:
          cpus: "${SOCKPUPPETBROWSER_CPU_LIMIT:-1}"
          memory: ${SOCKPUPPETBROWSER_MEMORY_LIMIT:-1G}

networks:
  homelab:
    external: true

volumes:
  changedetection_data:
