services:
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - wallos_db:/var/www/html/db
      - wallos_logos:/var/www/html/images/uploads/logos
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallos.rule=Host(`wallos.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.wallos.entrypoints=websecure"
      - "traefik.http.routers.wallos.tls=true"
      - "traefik.http.routers.wallos.middlewares=secure-headers@docker"
      - "traefik.http.services.wallos.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${WALLOS_CPU_LIMIT:-0.5}"
          memory: ${WALLOS_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true

volumes:
  wallos_db:
  wallos_logos:
