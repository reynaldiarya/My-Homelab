services:
  openspeedtest:
    image: openspeedtest/latest:latest
    container_name: openspeedtest
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "${BIND_IP}:${OPENSPEEDTEST_PORT:-3094}:3000"
    deploy:
      resources:
        limits:
          cpus: "${OPENSPEEDTEST_CPU_LIMIT:-0.5}"
          memory: ${OPENSPEEDTEST_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true