services:
  bugsink:
    image: bugsink/bugsink:latest
    container_name: bugsink
    restart: unless-stopped
    environment:
      - SECRET_KEY=${BUGSINK_SECRET_KEY}
      - CREATE_SUPERUSER=${BUGSINK_CREATE_SUPERUSER}
      - DATABASE_URL=${BUGSINK_DATABASE_URL}
      - BEHIND_HTTPS_PROXY=true
      - BASE_URL=https://bugsink.${TRAEFIK_DOMAIN:-yourdomain.com}
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bugsink.rule=Host(`bugsink.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.bugsink.entrypoints=websecure"
      - "traefik.http.routers.bugsink.tls=true"
      - "traefik.http.routers.bugsink.middlewares=secure-headers@docker"
      - "traefik.http.routers.bugsink.service=bugsink-svc"
      - "traefik.http.routers.bugsink-local.rule=Host(`bugsink.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.bugsink-local.entrypoints=websecure"
      - "traefik.http.routers.bugsink-local.tls=true"
      - "traefik.http.routers.bugsink-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.bugsink-local.service=bugsink-svc"
      - "traefik.http.services.bugsink-svc.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: "${BUGSINK_CPU_LIMIT:-0.5}"
          memory: ${BUGSINK_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true