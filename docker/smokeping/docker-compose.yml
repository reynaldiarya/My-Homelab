services:
  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: smokeping
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - PUID=${SMOKEPING_PUID:-1000}
      - PGID=${SMOKEPING_PGID:-1000}
      - MASTER_URL=${SMOKEPING_MASTER_URL:-}
    volumes:
      - smokeping_config:/config
      - smokeping_data:/data
      - ./config/Targets:/config/Targets
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smokeping.rule=Host(`smokeping.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.smokeping.entrypoints=websecure"
      - "traefik.http.routers.smokeping.tls=true"
      - "traefik.http.routers.smokeping.middlewares=secure-headers@docker,internal-only@file"
      - "traefik.http.routers.smokeping.service=smokeping-svc"
      - "traefik.http.routers.smokeping-local.rule=Host(`smokeping.${LOCAL_DOMAIN:-local}`)"
      - "traefik.http.routers.smokeping-local.entrypoints=websecure"
      - "traefik.http.routers.smokeping-local.tls=true"
      - "traefik.http.routers.smokeping-local.middlewares=secure-headers@docker"
      - "traefik.http.routers.smokeping-local.service=smokeping-svc"
      - "traefik.http.services.smokeping-svc.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${SMOKEPING_CPU_LIMIT:-0.5}"
          memory: ${SMOKEPING_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true

volumes:
  smokeping_config:
  smokeping_data: