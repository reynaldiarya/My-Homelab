services:
  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`it-tools.${TRAEFIK_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls=true"
      - "traefik.http.routers.it-tools.middlewares=secure-headers@docker"
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${IT_TOOLS_CPU_LIMIT:-0.5}"
          memory: ${IT_TOOLS_MEMORY_LIMIT:-256M}

networks:
  homelab:
    external: true
